name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Verify application
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: demo-papelcorpsac.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-papelcorpsac
      VITE_FIREBASE_STORAGE_BUCKET: demo-papelcorpsac.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      VITE_USE_FIREBASE_EMULATORS: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check API types
        run: npm run typecheck:api

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
